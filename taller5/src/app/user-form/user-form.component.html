<div class="form-container">
  <!-- Título principal con componente PrimeNG -->
  <div class="title-container">
    <h1 class="main-title">
      <i class="pi pi-user-plus"></i>
      Formulario de Registro
    </h1>
    <p class="subtitle">Completa tus datos para crear tu cuenta</p>
  </div>

  <p-card header="📝 Información Personal" subheader="Datos básicos del usuario" class="main-card">
    
    <!-- Toast para mensajes -->
    <p-toast></p-toast>
    
    <form (ngSubmit)="onSubmit()" class="user-form">
      
      <!-- Sección 1: Información Personal -->
      <div class="form-section">
        <h3 class="section-title">👤 Información Personal</h3>
        
        <div class="form-row">
          <!-- 1. InputText - Nombre -->
          <div class="field">
            <label for="nombre">Nombre Completo *</label>
            <input 
              pInputText 
              id="nombre" 
              [(ngModel)]="userData.nombre" 
              name="nombre"
              placeholder="Ingresa tu nombre completo"
              required>
          </div>

          <!-- 2. InputText - Email -->
          <div class="field">
            <label for="email">Correo Electrónico *</label>
            <input 
              pInputText 
              id="email" 
              [(ngModel)]="userData.email" 
              name="email"
              type="email"
              placeholder="tu@email.com"
              required>
          </div>
        </div>

        <div class="form-row">
          <!-- 3. Password - Contraseña -->
          <div class="field">
            <label for="password">Contraseña *</label>
            <p-password 
              id="password" 
              [(ngModel)]="userData.password" 
              name="password"
              placeholder="Ingresa tu contraseña"
              [feedback]="false"
              required>
            </p-password>
          </div>

          <!-- 4. Dropdown - País -->
          <div class="field country-field">
            <label for="pais">País</label>
            <p-dropdown 
              id="pais"
              [(ngModel)]="userData.pais" 
              name="pais"
              [options]="paises"
              placeholder="Selecciona tu país"
              optionLabel="label"
              optionValue="value"
              [showClear]="true"
              [filter]="true"
              filterBy="label">
            </p-dropdown>
          </div>
        </div>

        <div class="form-row">
          <!-- 5. Calendar - Fecha de Nacimiento -->
          <div class="field date-field">
            <label for="fecha">Fecha de Nacimiento</label>
            <p-calendar 
              id="fecha"
              [(ngModel)]="userData.fechaNacimiento" 
              name="fecha"
              placeholder="Selecciona tu fecha de nacimiento"
              [showIcon]="true"
              dateFormat="dd/mm/yy"
              [showButtonBar]="true">
            </p-calendar>
          </div>

          <!-- 6. RadioButton - Género -->
          <div class="field">
            <label>Género</label>
            <div class="radio-group">
              <div *ngFor="let genero of generos" class="radio-item" 
                   [class.selected]="userData.genero === genero.value">
                <p-radioButton 
                  [value]="genero.value" 
                  [(ngModel)]="userData.genero" 
                  name="genero"
                  [inputId]="genero.value">
                </p-radioButton>
                <label [for]="genero.value" class="radio-label">{{genero.label}}</label>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Divider -->
      <p-divider></p-divider>

      <!-- Botones de acción -->
      <div class="button-group">
        <button pButton type="submit" label="🚀 Enviar Formulario" class="p-button-success submit-btn"></button>
        <button pButton type="button" label="🧹 Limpiar" class="p-button-secondary clear-btn" (click)="clearForm()"></button>
      </div>

    </form>
  </p-card>
</div>
